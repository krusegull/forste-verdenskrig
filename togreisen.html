<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Togreisen gjennom krigen</title>
<style>
:root{
  /* Layout: steg 1 er en rutetabell der stasjonsskilt settes i rekkefølge; steg 2 er en jernbane som ruller sidelengs med en infotavle under */
  --bg:#e9e6dc; --card:#fffdf7; --ink:#1d2321; --mut:#5f6863; --line:#cfc9b8;
  --rail:#4a4038; --sign:#1f3a5f; --ok:#2f7d4f; --okbg:#e7f4ea; --bad:#b3261e; --badbg:#fbeeed; --gold:#c9a24a; --steam:#8b2f22;
  --display:"Arial Narrow","Helvetica Neue",Arial,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --mono:"Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
header{background:var(--steam);color:#fff;padding:16px 20px}
.top{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.05em;text-transform:uppercase;margin:0}
h1 small{display:block;font-family:var(--body);font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:#f1d9d3}
.back{color:#f1d9d3;font-size:15px;text-decoration:none;border:1px solid #c47a6c;border-radius:4px;padding:4px 10px}
.back:hover{color:#fff}
.ticket{font-family:var(--mono);font-size:15px;background:#f7efd9;color:var(--ink);border-radius:4px;padding:4px 10px;border:1px dashed #7a6a4a}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;margin:0 0 8px;text-wrap:balance}
p{margin:0 0 12px;max-width:68ch}
.lead{color:var(--mut)}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:11px 20px;font-family:var(--display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.red{background:var(--steam)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.row.split{justify-content:space-between}
.msg{min-height:1.5em;font-weight:700;margin:10px 0 0}
.msg.good{color:var(--ok)} .msg.bad{color:var(--bad)}
/* steg 1 */
.board{background:var(--sign);color:#fff;border-radius:10px;padding:14px;margin:14px 0}
.board .bh{display:flex;justify-content:space-between;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:#c8d6ea;margin:0 2px 10px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.slot{position:relative;min-height:74px;border:2px dashed #6f8bb0;border-radius:8px;background:#264a77;color:#fff;text-align:left;padding:8px 10px 8px 46px;display:flex;flex-direction:column;justify-content:center}
.slot .no{position:absolute;left:8px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--sign);font-family:var(--display);font-weight:700;display:grid;place-items:center;font-size:16px}
.slot .empty{color:#9fb4d1;font-size:15px}
.slot.filled{border-style:solid;border-color:#fff;background:#2d5588}
.slot.lock{border-color:#8fd3a6;background:#1f5a3a;cursor:default}
.slot.lock .d{display:block;font-size:13px;color:#bfe8cc;font-weight:700}
.slot.wrong{animation:shake .4s}
.slot:focus-visible,.cardb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.slot .t{font-weight:700;font-size:16px;line-height:1.3}
.pilewrap{position:sticky;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding:4px 0 10px;max-height:46vh;overflow:auto}
.pilewrap .row{margin-top:10px}
.pileh{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px;color:var(--mut);margin:8px 0 8px}
.pile{display:flex;flex-wrap:wrap;gap:8px}
.cardb{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--sign);border-radius:6px;padding:9px 12px;font-weight:700;font-size:16px;color:var(--ink);text-align:left;max-width:300px}
.cardb:hover{border-color:var(--ink);border-left-color:var(--sign)}
.cardb.sel{background:var(--sign);color:#fff;border-color:var(--sign)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* steg 2 */
.view{position:relative;height:250px;overflow:hidden;border-radius:10px;border:2px solid var(--line);background:#dfe8d6}
.view svg{position:absolute;left:0;top:0;height:250px;will-change:transform}
.panel{display:grid;grid-template-columns:120px 1fr;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-top:14px}
.panel .ic{width:120px;height:120px;border-radius:10px;background:#f1ece0;display:grid;place-items:center}
.panel .ic svg{width:96px;height:96px}
.panel .st{font-family:var(--mono);font-size:14px;color:var(--mut);margin:0 0 2px}
.panel .dt{display:inline-block;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--steam);color:#fff;border-radius:4px;padding:2px 10px;font-size:15px;margin:2px 0 8px}
.panel h3{font-family:var(--display);font-weight:700;font-size:26px;margin:0 0 6px}
.panel p{font-size:18px}
.stars{color:var(--gold);font-size:26px;letter-spacing:.1em}
@media (prefers-reduced-motion:no-preference){.puff{animation:puff 1.6s ease-out infinite}.puff.p2{animation-delay:.5s}.puff.p3{animation-delay:1s}
 @keyframes puff{0%{opacity:.8;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-26px,-38px) scale(1.6)}}}
@media (max-width:600px){.slots{grid-template-columns:1fr 1fr}.slot{min-height:64px;padding-left:40px}.slot .t{font-size:14px}.cardb{font-size:14px;padding:7px 10px}.panel{grid-template-columns:1fr}.panel .ic{width:90px;height:90px}.panel .ic svg{width:70px;height:70px} h2{font-size:26px}}
</style>
</head>

<header><div class="top"><h1>Togreisen gjennom krigen<small>Første verdenskrig, stasjon for stasjon</small></h1><a class="back" href="index.html">← Til kartet</a><span class="ticket" id="ticket">BILLETT · 1914–1919</span></div></header>
<main id="main"></main>

/* Ikoner, tegnet med enkle former */

 car:'<rect x="14" y="44" width="68" height="20" rx="6" fill="#2b2b2b"/><path d="M28 44 L36 30 H60 L68 44Z" fill="#444"/><circle cx="30" cy="66" r="8" fill="#111"/><circle cx="66" cy="66" r="8" fill="#111"/><circle cx="48" cy="22" r="7" fill="#8b2f22"/><path d="M41 22 h14" stroke="#2b2b2b" stroke-width="3"/>',

 flagBE:'<rect x="20" y="20" width="56" height="40" fill="#fff" stroke="#333"/><rect x="20" y="20" width="19" height="40" fill="#111"/><rect x="39" y="20" width="18" height="40" fill="#f2c500"/><rect x="57" y="20" width="19" height="40" fill="#d6262b"/><path d="M20 20v60" stroke="#5a4a3a" stroke-width="4"/>',

 gas:'<ellipse cx="34" cy="50" rx="20" ry="14" fill="#c8cf6a" opacity=".85"/><ellipse cx="56" cy="44" rx="22" ry="16" fill="#b5c050" opacity=".85"/><ellipse cx="48" cy="58" rx="26" ry="12" fill="#d6db86" opacity=".9"/><path d="M8 78h80" stroke="#7a5a3a" stroke-width="4"/>',

/* Stasjonene i riktig rekkefølge */

 {d:"28. juni 1914",y:1914,t:"Skuddene i Sarajevo",ic:"car",x:"Tronarvingen i Østerrike-Ungarn, Franz Ferdinand, og kona Sophie blir skutt og drept i Sarajevo av en 19 år gammel mann med tilknytning til Serbia. Skuddene blir den utløsende årsaken til krigen."},
 {d:"28. juli 1914",y:1914,t:"Østerrike-Ungarn erklærer Serbia krig",s:"Krig mot Serbia",ic:"scroll",x:"Østerrike-Ungarn gir Serbia ansvaret for drapet. Med løfte om støtte fra Tyskland, blankofullmakten, erklærer keiserriket krig mot Serbia en måned etter skuddene."},
 {d:"4. august 1914",y:1914,t:"Tyskland går gjennom Belgia",s:"Gjennom Belgia",ic:"flagBE",x:"Alliansene trekker stormaktene inn i krigen. Tyskland angriper Frankrike gjennom det nøytrale Belgia. Storbritannia hadde lovet å beskytte Belgia og erklærer krig mot Tyskland."},
 {d:"Høsten 1914",y:1914,t:"Vestfronten låser seg",ic:"trench",x:"Tyskernes plan om å slå Frankrike raskt slår feil. Hærene graver seg ned i skyttergraver fra Den engelske kanal til Sveits, og fronten står nesten stille i fire år."},
 {d:"22. april 1915",y:1915,t:"Giftgass ved Ypres",ic:"gas",x:"Ved Ypres i Belgia slipper tyskerne giftgass mot fiendens skyttergraver. Det er første gang giftgass brukes i stor skala. Ny teknologi gjør krigen mer dødelig enn noen krig før."},
 {d:"Mai 1915",y:1915,t:"Italia skifter side",ic:"flagIT",x:"Italia hadde vært med i trippelalliansen, men holdt seg utenfor krigen i 1914. Landet blir lovet landområder fra Østerrike-Ungarn og går inn i krigen på trippelententens side."},
 {d:"1. juli 1916",y:1916,t:"Slaget ved Somme",ic:"tank",x:"Britiske og franske styrker angriper ved Somme. Den første dagen blir rundt 57 000 britiske soldater drept, såret eller meldt savnet. I september tar britene i bruk stridsvogner for første gang."},
 {d:"Februar 1917",y:1917,t:"Uinnskrenket ubåtkrig",s:"Ubåtkrigen",ic:"sub",x:"Tyske ubåter senker skip til og fra Storbritannia og Frankrike, også fra nøytrale land. 1917 blir det verste året for den norske handelsflåten."},
 {d:"Mars 1917",y:1917,t:"Tsaren går av",ic:"crown",x:"I Russland fører krigen til sult og nød. Kvinner og arbeidere protesterer, soldatene nekter å skyte, og tsaren blir tvunget til å gå av."},

const main=$("#main");

/* ---------- steg 1: legg sporet ---------- */
function build(){
  const place=Array(N).fill(null),lock=Array(N).fill(false);let pile=shuffle(ST.map((_,i)=>i)),sel=null;tries=0;

/* ---------- steg 2: togreisen ---------- */
const GAP=260,X0=200,TY=190;
const YC={1914:"#dfe8d6",1915:"#e5e3cf",1916:"#e2dbcf",1917:"#d9e0e6",1918:"#e6e1d6",1919:"#e8ecef"};
let world,trainG,viewEl,curX=X0,anim=null;
function drawWorld(){
  const W=X0*2+GAP*(N-1);
  const s=svg("svg",{viewBox:"0 0 "+W+" 250",width:W,height:250,role:"img","aria-label":"Jernbane med "+N+" stasjoner fra 1914 til 1919"});

  s.append(svg("rect",{x:start,y:0,width:W-start,height:250,fill:YC[prev]}));
  /* åsrygger */
  for(let x=-100;x<W;x+=340)s.append(svg("ellipse",{cx:x+170,cy:200,rx:230,ry:90,fill:"#000",opacity:".05"}));
  /* årsskilt */
  prev=null;ST.forEach((st,i)=>{if(st.y!==prev){const x=i===0?40:(xs[i-1]+xs[i])/2;s.append(svg("rect",{x:x-30,y:14,width:60,height:26,rx:4,fill:"#1d2321"}),svg("text",{x:x,y:32,"text-anchor":"middle","font-family":"Arial,sans-serif","font-size":15,"font-weight":"700",fill:"#fff"},String(st.y)));prev=st.y}});
  /* skinner */
  for(let x=0;x<W;x+=18)s.append(svg("rect",{x:x,y:TY+2,width:8,height:14,fill:"#7a6650"}));
