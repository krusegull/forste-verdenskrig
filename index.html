<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Læringsportalen – velg fag</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800;9..144,900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
<script>/* Henter alltid nyeste fag-liste, så nye fag og temaer vises med en gang */
document.write('<script src="katalog.js?t='+Date.now()+'"><\/script>');</script>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div class="logo">📚</div>
    <h1>Læringsportalen</h1>
    <p>Velg fag for å se temaene</p>
  </header>
  <section class="grid" id="fag"></section>
</main>
<script>
const el = document.getElementById("fag");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
el.innerHTML = KATALOG.map(f => {
  const n = f.temaer.filter(t => !t.skjult).length;
  return `<a class="card" href="fag.html?fag=${encodeURIComponent(f.id)}" style="--c:${f.farge}">
    <span class="ic">${f.ikon}</span>
    <h2>${esc(f.navn)}</h2>
    <span class="desc">${esc(f.beskrivelse || "")}</span>
    <span class="meta">${n} ${n === 1 ? "tema" : "temaer"} →</span></a>`;
}).join("");
</script>
</body>
</html>
