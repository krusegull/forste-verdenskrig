<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Krigsdagbøkene</title>
<style>
:root{
  /* Layout: fem dagbøker som kort, en felles tidslinje med én rad per person, ett dagbokark om gangen */
  --bg:#e7ebe6; --page:#fffdf8; --ink:#1c2423; --mut:#5c6b68; --line:#c9d0ca;
  --ok:#2f7d4f; --okbg:#eaf5ee; --bad:#b3261e; --badbg:#fbeeed; --gold:#b8892a;
  --display:"Arial Narrow","Helvetica Neue",Arial,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --hand:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
header{background:var(--ink);color:#fff;padding:16px 20px}
.top{max-width:940px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.05em;text-transform:uppercase;margin:0}
h1 small{display:block;font-family:var(--body);font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:#c8d2ce}
.back{color:#c8d2ce;font-size:15px;text-decoration:none;border:1px solid #47595a;border-radius:4px;padding:4px 10px}
.back:hover{color:#fff}
.score{font-family:var(--display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
main{max-width:940px;margin:0 auto;padding:20px 16px 60px}
h2{font-family:var(--display);font-weight:700;font-size:30px;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
p{margin:0 0 12px;max-width:66ch}
.lead{color:var(--mut)}
.note{font-size:15px;color:var(--mut);border-left:4px solid var(--gold);padding:2px 0 2px 10px;margin:8px 0 18px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:10px 20px;font-family:var(--display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.lane{background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 12px 6px;margin:0 0 18px}
.lane svg{display:block;width:100%;height:auto}
.lane .cap{font-size:14px;color:var(--mut);margin:4px 4px 6px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.person{background:var(--page);border:2px solid var(--line);border-top-width:8px;border-radius:10px;padding:14px 16px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.person:hover{border-color:var(--ink)}
.person .meta{color:var(--mut);font-size:15px}
.person .prog{margin-top:8px;font-size:15px;font-weight:600}
.person .bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.person .bar i{display:block;height:100%}
.final{margin-top:18px;background:#fff;border:2px dashed var(--ink);border-radius:10px;padding:16px 18px}
.diary{display:grid;gap:14px}
.dhead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.sheet{background:var(--page);border:1px solid var(--line);border-left-width:8px;border-radius:6px;padding:18px clamp(14px,3vw,26px);box-shadow:0 2px 0 rgba(0,0,0,.04)}
.when{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px}
.entry{font-family:var(--hand);font-size:20px;line-height:1.55;font-style:italic;margin:0 0 12px;max-width:62ch}
.past .entry{font-size:17px}
.qq{font-weight:700;margin:14px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:#fff;border:2px solid var(--line);border-radius:8px;padding:11px 12px;text-align:left;color:var(--ink);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--okbg);color:#1d5234}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.fb{margin:12px 0 0;font-weight:600}
.fb.good{color:var(--ok)} .fb.bad{color:var(--bad)}
.ex{font-size:16px;margin:6px 0 0;max-width:66ch}
.res{display:inline-block;font-size:14px;font-weight:700;border-radius:12px;padding:1px 10px;margin-bottom:6px}
.res.y{background:var(--okbg);color:#1d5234} .res.n{background:var(--badbg);color:var(--bad)}
.chain{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px}
.chain li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:8px;padding:8px 12px}
.chain li.ok{border-color:var(--ok);background:var(--okbg)}
.chain .d{display:block;font-size:14px;color:var(--ok);font-weight:700}
.arrows button{background:#fff;border:2px solid var(--line);border-radius:4px;width:38px;height:32px;color:var(--ink)}
.msg{min-height:1.5em;font-weight:600;margin:10px 0 0}
.msg.good{color:var(--ok)} .msg.bad{color:var(--bad)}
.done{background:var(--ink);color:#fff;border-radius:10px;padding:18px 20px;margin-bottom:18px}
.done b{font-family:var(--display);font-size:26px;color:#e8c46a}
.done p{margin:6px 0 0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:560px){.opts{grid-template-columns:1fr} .entry{font-size:18px} h2{font-size:26px}}
</style>
</head>

}

/* ---------- oversikt ---------- */
function hub(){
  const all=answered()===TOTAL;
  main.replaceChildren(
    all?el("div",{class:"done"},el("b",{},right()+" av "+TOTAL+" riktige"),el("p",{},"Du har lest alle fem dagbøkene. Velg én av personene og skriv noen setninger: Hvordan ville livet til denne personen ha vært annerledes hvis krigen ikke hadde skjedd?")):"",
    el("h2",{},"Fem dagbøker fra krigen"),
    el("p",{class:"lead"},"Les dagbøkene til fem personer som opplevde første verdenskrig på hver sin måte. Etter hver side får du et spørsmål. Du kan lese dagbøkene i den rekkefølgen du vil."),
    el("p",{class:"note"},"Personene er oppdiktet, men hendelsene de forteller om, er virkelige."),
    lane(),
    el("div",{class:"people"},P.map(p=>{const n=S.res[p.id].length,k=S.res[p.id].filter(Boolean).length,b=el("i");b.style.width=(100*n/p.E.length)+"%";b.style.background=p.col;
      const card=el("button",{class:"person",type:"button",onclick:()=>diary(p.id)},el("h3",{},p.name),el("span",{class:"meta"},p.role+" · "+p.place),
        el("span",{class:"prog"},n===0?"Ikke begynt":n===p.E.length?"Ferdig: "+k+" av "+p.E.length+" riktige":n+" av "+p.E.length+" sider lest"),el("span",{class:"bar"},b));
      card.style.borderTopColor=p.col;return card})),
    el("div",{class:"final"},el("h3",{},"Siste oppdrag: Krigens gang"),el("p",{style:"margin:6px 0 0"},"Legg ni av hendelsene fra dagbøkene i riktig rekkefølge."+(S.fin?" Du klarte det på "+S.fin+" forsøk.":"")),
      el("div",{class:"row"},el("button",{class:"btn",type:"button",onclick:finale},S.fin?"Prøv igjen":"Start"))));
  setScore();toTop();
}

/* ---------- dagbok ---------- */
function diary(pid,focus){
  const p=P.find(x=>x.id===pid),res=S.res[pid],n=res.length;
  const wrap=el("div",{class:"diary"});
  const sheetFor=(e,i)=>{const s=el("div",{class:"sheet"+(i<n?" past":""),"data-i":i});s.style.borderLeftColor=p.col;
    s.append(el("p",{class:"when",style:"color:"+p.col},e.when),el("p",{class:"entry"},e.text));
    if(i<n){s.append(el("span",{class:"res "+(res[i]?"y":"n")},res[i]?"Riktig svar":"Feil svar"),el("p",{class:"qq",style:"margin-top:2px"},e.q),el("p",{class:"ex"},e.ex))}
    else question(s,p,e,i);
    return s};
  p.E.slice(0,Math.min(n+1,p.E.length)).forEach((e,i)=>wrap.append(sheetFor(e,i)));
  if(n===p.E.length)wrap.append(el("div",{class:"row"},el("button",{class:"btn",type:"button",onclick:hub},"Tilbake til dagbøkene")));
  main.replaceChildren(el("div",{class:"dhead"},el("h2",{style:"color:"+p.col},p.name+"s dagbok"),el("button",{class:"btn ghost",type:"button",onclick:hub},"Alle dagbøkene")),
    el("p",{class:"lead"},p.role+" · "+p.place+" · side "+Math.min(n+1,p.E.length)+" av "+p.E.length),wrap);
  setScore();
  const tgt=focus!=null?$('.sheet[data-i="'+focus+'"]',main):$$(".sheet",main).pop();
  if(tgt&&(focus!=null||n>0)){try{tgt.scrollIntoView({block:"start"})}catch(e){}}else toTop();
}
function question(s,p,e,i){
  const fb=el("p",{class:"fb","aria-live":"polite"}),next=el("div",{class:"row"});
  const answer=(ok,btn,box)=>{S.res[p.id][i]=ok;setScore();$$(".opt",box).forEach(b=>b.disabled=true);btn.classList.add(ok?"right":"wrong");
    if(!ok){const r=$$(".opt",box).find(b=>b.dataset.r==="1");if(r)r.classList.add("right")}
    fb.textContent=ok?"Riktig.":"Feil.";fb.className="fb "+(ok?"good":"bad");s.insertBefore(el("p",{class:"ex"},e.ex),next);
    const last=i===p.E.length-1;const b=el("button",{class:"btn",type:"button",onclick:()=>last?hub():diary(p.id)},last?"Tilbake til dagbøkene":"Neste side");next.append(b);b.focus()};
  let box;
  if(e.tf!==undefined){box=el("div",{class:"opts"});[["Sant",true],["Usant",false]].forEach(([t,v])=>box.append(el("button",{class:"opt",type:"button","data-r":v===e.tf?"1":"0",onclick:ev=>answer(v===e.tf,ev.currentTarget,box)},t)))}
  else{box=el("div",{class:"opts"});S.opts[p.id][i].forEach(t=>box.append(el("button",{class:"opt",type:"button","data-r":t===e.opts[0]?"1":"0",onclick:ev=>answer(t===e.opts[0],ev.currentTarget,box)},t)))}
  s.append(el("p",{class:"qq"},e.q),box,fb,next);
}

/* ---------- siste oppdrag ---------- */
function finale(){
  let ord=shuffle(EV.map((_,i)=>i)),tries=0,locked=false;
  while(ord.every((x,i)=>x===i))ord=shuffle(ord);
  const ol=el("ol",{class:"chain"}),msg=el("p",{class:"msg","aria-live":"polite"});
  const draw=chk=>ol.replaceChildren(...ord.map((id,pos)=>{const ok=chk&&id===pos;
    return el("li",{class:ok?"ok":""},el("span",{},EV[id][0],ok?el("span",{class:"d"},EV[id][1]):""),
      el("span",{class:"arrows"},el("button",{type:"button","aria-label":"Flytt opp",onclick:()=>mv(pos,-1)},"▲")," ",el("button",{type:"button","aria-label":"Flytt ned",onclick:()=>mv(pos,1)},"▼")))}));
  const mv=(p,d)=>{if(locked)return;const q=p+d;if(q<0||q>=ord.length)return;[ord[p],ord[q]]=[ord[q],ord[p]];draw(false)};
  draw(false);
  const chk=el("button",{class:"btn",type:"button",onclick:()=>{tries++;const r=ord.filter((id,p)=>id===p).length;draw(true);
    if(r===EV.length){locked=true;draw(true);$$("button",ol).forEach(b=>b.disabled=true);chk.disabled=true;S.fin=S.fin?Math.min(S.fin,tries):tries;
      msg.textContent="Hele rekkefølgen er riktig, etter "+tries+" forsøk. Datoene står nå på kortene.";msg.className="msg good"}
    else{msg.textContent=r+" av "+EV.length+" står på riktig plass. De med grønn kant er riktige.";msg.className="msg bad"}}},"Sjekk rekkefølgen");
  main.replaceChildren(el("div",{class:"dhead"},el("h2",{},"Krigens gang"),el("button",{class:"btn ghost",type:"button",onclick:hub},"Alle dagbøkene")),
    el("p",{class:"lead"},"Legg hendelsene i riktig rekkefølge, med den eldste øverst. Bruk pilene."),ol,el("div",{class:"row"},chk),msg);
  toTop();
}
hub();
</script>
