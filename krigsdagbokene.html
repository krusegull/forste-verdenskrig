<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Krigens gang</title>
<style>
:root{
  /* Layout: én hendelse om gangen med framdriftslinje øverst, dagbokstemmer i egne bokser, skrivearbeid og sammendrag til slutt */
  --bg:#e7ebe6; --page:#fffdf8; --ink:#1c2423; --mut:#5c6b68; --line:#c9d0ca;
  --ok:#2f7d4f; --okbg:#eaf5ee; --bad:#b3261e; --badbg:#fbeeed; --gold:#b8892a; --accent:#8e2f22;
  --display:"Arial Narrow","Helvetica Neue",Arial,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --hand:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
header{background:var(--ink);color:#fff;padding:16px 20px}
.top{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.05em;text-transform:uppercase;margin:0}
h1 small{display:block;font-family:var(--body);font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:#c8d2ce}
.back{color:#c8d2ce;font-size:15px;text-decoration:none;border:1px solid #47595a;border-radius:4px;padding:4px 10px}
.back:hover{color:#fff}
.score{font-family:var(--display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h2{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.15;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 6px}
p{margin:0 0 12px;max-width:68ch}
.lead{color:var(--mut)}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:11px 20px;font-family:var(--display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.small{padding:2px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.row.split{justify-content:space-between}
.card{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,4vw,32px)}
.prog{display:grid;grid-template-columns:repeat(22,1fr);gap:3px;margin:0 0 6px}
.prog button{height:12px;border:0;border-radius:3px;background:var(--line);padding:0}
.prog button.y{background:var(--ok)} .prog button.n{background:var(--bad)}
.prog button.cur{outline:2px solid var(--ink);outline-offset:1px}
.prog button:disabled{cursor:default}
.plabel{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut);margin:0 0 14px}
.date{display:inline-block;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:4px;padding:3px 10px;margin:0 0 10px}
.txt{font-size:19px;line-height:1.6}
.voice{border-left:6px solid var(--gold);background:#faf5e8;border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 6px}
.voice .who{font-size:14px;font-weight:700;margin:0 0 4px}
.voice .who span{font-weight:400;color:var(--mut)}
.voice q{display:block;font-family:var(--hand);font-style:italic;font-size:19px;line-height:1.55;quotes:"«" "»"}
.qbox{border-top:2px dashed var(--line);margin-top:18px;padding-top:14px}
.qq{font-weight:700;margin:0 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:#fff;border:2px solid var(--line);border-radius:8px;padding:11px 12px;text-align:left;color:var(--ink);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg);color:#1d5234}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.fb{margin:12px 0 4px;font-weight:700}
.fb.good{color:var(--ok)} .fb.bad{color:var(--bad)}
.ex{font-size:17px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:12px 0}
.people div{background:#faf5e8;border-radius:8px;padding:8px 12px;font-size:15px}
.people b{display:block;font-size:17px}
.fields{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:8px 0 18px}
label{display:block;font-weight:700;margin:0 0 6px}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input[type=text]:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.task{margin:0 0 18px}
.task .help{font-size:15px;color:var(--mut);margin:-2px 0 6px}
.part{margin:24px 0 12px;padding-top:14px;border-top:2px solid var(--ink)}
.status{min-height:1.5em;font-weight:600;margin:10px 0 0}
.status.good{color:var(--ok)} .status.bad{color:var(--bad)}
.sum h3{margin-top:18px}
.sum ul{margin:6px 0 0;padding-left:22px}
.sum li{margin:0 0 6px;max-width:68ch}
.sum dl{margin:6px 0 0}
.sum dt{font-weight:700}
.sum dd{margin:0 0 8px 0}
.done{background:var(--ink);color:#fff;border-radius:10px;padding:16px 20px;margin:0 0 16px}
.done b{font-family:var(--display);font-size:26px;color:#e8c46a}
.done p{margin:4px 0 0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:560px){.opts,.fields{grid-template-columns:1fr} h2{font-size:27px} .txt{font-size:18px} .prog{gap:2px}}
</style>
</head>
<body>
<header><div class="top"><h1>Krigens gang<small>Første verdenskrig, hendelse for hendelse</small></h1><a class="back" href="index.html">← Til kartet</a><div class="score" id="score" aria-live="polite">0 av 22 riktige</div></div></header>
<main id="main"></main>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="class")e.className=v;else if(x.startsWith("on"))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}k.flat().forEach(c=>e.append(c));return e};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* Oppdiktede personer som kommenterer hendelsene */
const V={karl:["Karl","tysk soldat"],ivan:["Ivan","russisk soldat"],mary:["Mary","fabrikkarbeider i Skottland"],arjun:["Arjun","indisk soldat i britisk tjeneste"],ole:["Ole","norsk sjømann"]};

/* Hendelsene i kronologisk rekkefølge. Første svaralternativ er riktig. tf = sant/usant. */
const E=[
{d:"Før 1914",t:"Europa i to leire",x:"I årene før 1914 vokste spenningene mellom statene i Europa. Nasjonalisme og imperialisme skapte konflikter, og statene svarte med militær opprustning. Stormaktene delte seg i to allianser: Tyskland, Østerrike-Ungarn og Italia dannet trippelalliansen, mens Storbritannia, Frankrike og Russland sto sammen i trippelententen. Balkan var et urolig hjørne av Europa. Serbia ønsket deler av Bosnia-Hercegovina, som var en del av keiserriket Østerrike-Ungarn.",
 q:"Hvilke land dannet trippelententen?",o:["Storbritannia, Frankrike og Russland","Tyskland, Østerrike-Ungarn og Italia","Storbritannia, Tyskland og Serbia","Frankrike, Italia og Norge"],
 ex:"Trippelententen besto av Storbritannia, Frankrike og Russland. Alliansene gjorde at en konflikt mellom to land fort kunne trekke med seg flere."},
{d:"28. juni 1914",t:"Skuddene i Sarajevo",x:"Tronarvingen i Østerrike-Ungarn, Franz Ferdinand, var på besøk i Sarajevo i Bosnia-Hercegovina sammen med kona Sophie. Langs ruta sto en 19 år gammel mann med tilknytning til Serbia. Da bilen passerte, tok han fram en pistol og drepte dem begge. Attentatet kalles skuddene i Sarajevo og blir regnet som startskuddet for første verdenskrig.",
 q:"Hva slags årsak til krigen var skuddene i Sarajevo?",o:["En utløsende årsak","En grunnleggende årsak","En konsekvens av krigen","En del av fredsavtalen"],
 ex:"Skuddene var den utløsende årsaken, fyrstikken som tente bålet. Uten de grunnleggende årsakene, som spenningene mellom statene, ville det likevel ikke ha blitt krig."},
{d:"Juli 1914",t:"Blankofullmakten",x:"Østerrike-Ungarn ga Serbia ansvaret for drapet. Makthaverne i keiserriket følte seg truet av Serbia og hadde nærmest ønsket seg en unnskyldning for å gå til krig. Før de angrep, sikret de seg støtte fra alliansepartneren Tyskland. Denne støtten kalles blankofullmakten. 28. juli 1914, en måned etter skuddene, erklærte Østerrike-Ungarn krig mot Serbia.",
 q:"Hva var blankofullmakten?",o:["Tysklands løfte om å støtte Østerrike-Ungarn","Fredsavtalen etter krigen","Serbias krigserklæring mot Østerrike-Ungarn","En avtale om at Norge skulle være nøytralt"],
 ex:"Tyskland lovet å støtte Østerrike-Ungarn. Blankofullmakten bidro til at Tyskland senere fikk skylden for krigsutbruddet."},
{d:"1.–4. august 1914",t:"Stormaktene går til krig",x:"Nå trakk alliansene flere land inn i krigen. Russland hadde lovet å støtte Serbia, og Frankrike var alliert med Russland. Tyskland erklærte krig mot Russland 1. august og mot Frankrike 3. august. Tyskland ville slå Frankrike raskt og angrep gjennom det nøytrale Belgia. Storbritannia hadde lovet å beskytte Belgia og erklærte krig mot Tyskland 4. august.",
 v:["karl","Vi marsjerer vestover gjennom Belgia. Offiserene sier at vi ikke har tid til å gå rundt. Ingen vet hvor lenge dette vil vare."],
 q:"Hvorfor gikk Storbritannia med i krigen?",o:["Storbritannia hadde lovet å beskytte Belgia","Storbritannia var med i trippelalliansen","Storbritannia ville ta over Belgias kolonier","Tyskland hadde angrepet Storbritannia først"],
 ex:"Da Tyskland gikk gjennom Belgia for å nå Frankrike, ble Storbritannia trukket inn, fordi landet hadde lovet å beskytte Belgia."},
{d:"August 1914",t:"Norge erklærer seg nøytralt",x:"Da krigen brøt ut, erklærte Norge seg nøytralt. Men de krigførende landene var interessert i den store norske handelsflåten og i norske råvarer som metaller og fisk. De første krigsårene handlet Norge med begge parter.",
 v:["ole","Norge skal ikke ta side i krigen. Men skipet vårt seiler videre med last, og havet er ikke trygt lenger."],
 q:"Hva betyr det at et land er nøytralt?",o:["Landet tar ikke side i krigen","Landet kjemper på den sterkeste siden","Landet stenger alle havnene sine","Landet sender bare soldater, ikke skip"],
 ex:"Et nøytralt land tar ikke side i en krig. Norge var nøytralt gjennom hele krigen, men knyttet seg etter hvert sterkere til Storbritannia."},
{d:"Høsten 1914",t:"Vestfronten låser seg",x:"Tyskernes plan om å slå Frankrike raskt slo feil. Langs det som ble kalt vestfronten, gravde hærene på begge sider seg ned i skyttergraver. De strakte seg fra Den engelske kanal og helt til Sveits. Mellom skyttergravene lå ingenmannsland. Her kjempet soldatene mot hverandre i de fire årene krigen varte, uten at noen av partene hadde framgang.",
 v:["karl","Skyttergraven er full av gjørme. Fienden ligger i sin egen grav på den andre siden av ingenmannsland, og ingen kommer seg framover."],
 q:"Hva var ingenmannsland?",o:["Området mellom skyttergravene til de to sidene","Et nøytralt land som Norge","Et område der ingen fikk bo etter krigen","En leir for krigsfanger"],
 ex:"Ingenmannsland var området mellom skyttergravene. Den som angrep, måtte løpe over det, og det var svært farlig."},
{d:"Slutten av 1914",t:"Krigen blir en verdenskrig",x:"Det osmanske riket inngikk en allianse med Tyskland og Østerrike-Ungarn, og dermed ble også Midtøsten trukket inn i krigen. Både Storbritannia og Frankrike hentet soldater fra koloniene sine til skyttergravene i Europa. I Øst-Afrika kjempet tyske kolonisoldater mot britene, og i Asia ble flere tyske kolonier erobret. Det ble også kjempet på havet.",
 v:["arjun","Jeg er soldat fra India, som er en britisk koloni. Vi har seilt over havet for å kjempe i Frankrike. Det er kaldt og vått her, og alt er fremmed."],
 q:"Krigen ble mest utkjempet i Europa. Hvorfor kalles den likevel en verdenskrig?",o:["Det ble kjempet i flere verdensdeler, og soldater kom fra hele verden","Alle land i verden var med i krigen","Den varte lenger enn alle andre kriger","Den begynte i Amerika"],
 ex:"Krigen spredte seg til Midtøsten, Afrika, Asia og havene, og soldater fra koloniene kjempet i Europa."},
{d:"22. april 1915",t:"Giftgass ved Ypres",x:"Ved Ypres i Belgia slapp tyskerne giftgass mot fiendens skyttergraver. Det var første gang giftgass ble brukt i stor skala. Den teknologiske utviklingen hadde gitt nye, dødelige våpen, som maskingevær, giftgass, stridsvogner, fly og ubåter. Derfor kalles første verdenskrig gjerne den første moderne krigen. Soldatene fikk gassmasker for å beskytte seg.",
 v:["karl","En gulgrønn sky drev over ingenmannsland. Nå har vi alle fått beskjed om å ha gassmasken klar."],
 q:"Hvorfor kalles første verdenskrig gjerne «den første moderne krigen»?",o:["Ny teknologi ga nye, dødelige våpen som ble brukt i krig for første gang","Det var den første krigen der det deltok soldater","Det var den første krigen som ble utkjempet i Europa","Krigen ble avgjort i løpet av noen få dager"],
 ex:"Våpen som giftgass, maskingevær og stridsvogner gjorde krigen langt mer dødelig enn tidligere kriger."},
{d:"Mai 1915",t:"Italia skifter side",x:"Italia hadde vært med i trippelalliansen, men holdt seg utenfor krigen i 1914. I en hemmelig avtale lovet Storbritannia, Frankrike og Russland at Italia skulle få landområder fra Østerrike-Ungarn hvis landet gikk med på deres side. I mai 1915 gikk Italia inn i krigen mot Østerrike-Ungarn, på trippelententens side.",
 q:"Hvorfor skiftet Italia side?",o:["Italia ble lovet landområder fra Østerrike-Ungarn","Italia ble angrepet av Storbritannia","Italia ville beskytte Belgia","Italia var redd for Russland"],
 ex:"Italia ble lovet landområder. Etter krigen mente mange italienere at landet ikke fikk det som var lovet, og den misnøyen møter du igjen senere i forløpet."},
{d:"Sommeren 1915",t:"Bevegelse på østfronten",x:"På østfronten kjempet Tyskland og Østerrike-Ungarn mot Russland. Her var det mer bevegelse enn i vest, og frontlinjen flyttet seg langt. Sommeren 1915 ble de russiske styrkene presset langt tilbake. For Tyskland var det likevel krevende å kjempe både i vest og øst samtidig.",
 v:["ivan","Vi ligger ikke stille i skyttergraver her. Vi marsjerer og marsjerer, men nå går det bakover. Det mangler både våpen og mat."],
 q:"Sant eller usant: Det var mer bevegelse på østfronten enn på vestfronten.",tf:true,
 ex:"Sant. På vestfronten sto fronten nesten stille, mens den flyttet seg mye på østfronten."},
{d:"1915–1918",t:"Kvinnene overtar jobbene",x:"Mange menn reiste i krigen, og kvinnene måtte gjøre jobbene menn vanligvis utførte. Industrien som laget våpen og utstyr til krigen, hadde stort behov for arbeidere. Mange kvinner fikk dermed jobb utenfor hjemmet og tjente penger for første gang. Kvinner gjorde også en stor innsats som sykepleiere, ofte nær fronten.",
 v:["mary","Jeg har fått jobb på en ammunisjonsfabrikk. Før var dette mannsarbeid. Nå er det fullt av kvinner her, og jeg tjener mine egne penger."],
 q:"Hvorfor fikk mange kvinner jobb i industrien under krigen?",o:["Mange menn var i krigen, og industrien trengte arbeidere","Det ble forbudt for menn å jobbe i fabrikker","Kvinnene ble sendt dit som straff","Fabrikkene ble flyttet til nøytrale land"],
 ex:"Industrien trengte arbeidere mens mennene var i krigen. Erfaringene kan ha påvirket kvinnenes stilling i samfunnet senere."},
{d:"1. juli 1916",t:"Slaget ved Somme",x:"Ved elva Somme i Frankrike gikk britiske og franske styrker til et stort angrep. Bare den første dagen ble rundt 57 000 britiske soldater drept, såret eller meldt savnet. Soldatene måtte løpe over ingenmannsland mot maskingevær og piggtråd. 15. september 1916 tok britene i bruk et nytt våpen her: stridsvognen.",
 v:["mary","Avisene skriver om et stort angrep ved Somme. Det sies at tapene er enorme. Jeg venter og venter på brev fra bror min."],
 q:"Hvorfor ble tapene så store når soldatene angrep på vestfronten?",o:["De måtte løpe over ingenmannsland mot maskingevær og piggtråd","De angrep uten våpen","De kjempet til sjøs i stedet for på land","Angrepene skjedde bare om natta"],
 ex:"Soldater som løp over åpent terreng, var et lett mål for maskingevær. Derfor kostet angrepene svært mange liv."},
{d:"Februar 1917",t:"Ubåtkrigen rammer Norge",x:"I februar 1917 startet Tyskland en uinnskrenket ubåtkrig. Tyske ubåter senket skip som fraktet varer til og fra Storbritannia og Frankrike, også skip fra nøytrale land. 1917 ble det verste året for den norske handelsflåten. Under hele krigen gikk over åtte hundre norske skip tapt, og rundt to tusen norske sjøfolk mistet livet. Det bidro til en antitysk stemning i Norge. Norge var avhengig av kull og andre varer fra Storbritannia, og store deler av handelsflåten ble stilt til disposisjon for britene.",
 v:["ole","Mange av gutta tør nesten ikke mønstre på lenger. Hver gang vi seiler ut, tenker vi på ubåtene."],
 q:"Hvorfor ble Norge hardt rammet av krigen, selv om landet var nøytralt?",o:["Tyske ubåter senket også skip fra nøytrale land","Norge sendte soldater til vestfronten","Norge ble okkupert av Tyskland","Norge erklærte krig mot Tyskland"],
 ex:"Den norske handelsflåten seilte i farlige farvann, og ubåtene skilte ikke mellom nøytrale og krigførende land. Norge ble derfor kalt «den nøytrale allierte»."},
{d:"Mars 1917",t:"Tsaren går av",x:"Russland hadde i flere hundre år vært styrt av en eneveldig tsar som nektet å demokratisere landet. Arbeiderne hadde lav lønn og dårlige levekår, og krigen gjorde det enda verre: Både soldatene og sivilbefolkningen manglet mat. I mars 1917 forlot flere tusen kvinner arbeidsplassene sine i protest, og de fikk støtte av mannlige arbeidere. Tsaren prøvde å slå ned opprøret, men soldatene nektet å skyte. Tsaren ble tvunget til å gå av. De nye lederne ville demokratisere landet, men også fortsette krigen.",
 v:["ivan","Det er ikke nok mat, verken her ved fronten eller hjemme. Nå sier de at tsaren har gått av. Hvorfor må vi fortsatt kjempe?"],
 q:"Hva var en viktig grunn til revolusjonen i Russland i 1917?",o:["Krigen gjorde nøden verre, og folk manglet mat","Tsaren hadde nettopp innført demokrati","Russland hadde vunnet krigen","Tyskland krevde at tsaren skulle gå av"],
 ex:"Tsaren var allerede upopulær, og krigen førte til sult og nød. Da soldatene nektet å skyte på demonstrantene, mistet tsaren makten."},
{d:"6. april 1917",t:"USA går med i krigen",x:"Også amerikanske skip ble senket av tyske ubåter, og det bidro til at USA erklærte krig mot Tyskland. Dermed fikk Storbritannia og Frankrike en mektig ny støttespiller. Den amerikanske presidenten Woodrow Wilson la allerede under krigen fram forslag til hvordan man kunne skape fred i Europa.",
 v:["ole","Nyheten har nådd oss i havn: USA har erklært krig mot Tyskland."],
 q:"Hva bidro til at USA gikk med i krigen i 1917?",o:["Tyske ubåter senket amerikanske skip","Japan angrep USA","Skuddene i Sarajevo","Norge ba USA om hjelp"],
 ex:"Ubåtkrigen rammet også amerikanske skip, og det bidro til at USA erklærte krig mot Tyskland."},
{d:"November 1917",t:"Bolsjevikene tar makten",x:"Vladimir Lenin hadde protestert mot tsaren og flyktet fra Russland for å unngå å bli arrestert. I 1917 kom han tilbake. «Fred, jord, brød» var slagordet, og høsten 1917 gjennomførte Lenin og bolsjevikpartiet et statskupp. Bolsjevikene ønsket ikke demokrati: Nasjonalforsamlingen ble oppløst med militærmakt, og andre partier ble forbudt. De kalte seg kommunister, og målet var et klasseløst samfunn uten forskjell på fattige og rike.",
 q:"Hva var målet med kommunismen?",o:["Et klasseløst samfunn uten forskjell på fattige og rike","Én sterk leder og et sterkt nasjonalt fellesskap","At tsaren skulle få mer makt","At Russland skulle få kolonier i Afrika"],
 ex:"Kommunistene ville ha et klasseløst samfunn. Et virkemiddel var planøkonomi, der staten eier fabrikkene og bestemmer hva som skal produseres."},
{d:"Januar 1918",t:"Dyrtid og brødkort i Norge",x:"Krigen påvirket også hverdagen i Norge. I de to første krigsårene tjente en del mennesker mye penger, særlig de som eide skipsaksjer. De siste krigsårene steg prisene mer enn lønningene, og mange familier fikk problemer. Perioden kalles dyrtid. Det ble mangel på varer, og mat og drivstoff måtte rasjoneres. Forskjellen mellom rike og fattige ble mer synlig, og det kan være én av årsakene til at Arbeiderpartiet ble landets største parti i mellomkrigstiden.",
 v:["ole","Mor skriver at alt har blitt så dyrt hjemme. Nå har de fått brødkort, og hun får bare kjøpe en bestemt mengde brød hver uke."],
 q:"Hva kalles det når prisene stiger mer enn lønningene?",o:["Dyrtid","Rasjonering","Nøytralitet","Planøkonomi"],
 ex:"Det kalles dyrtid. Brødkortet er et eksempel på rasjonering, altså at hver person bare får kjøpe en bestemt mengde av varer det er mangel på."},

  if(d){try{await d.save({filename:name,data:blob});status("Filen er lastet ned.",true)}catch(e){const c=e&&e.code;status(c==="declined"?"Nedlastingen ble avbrutt.":"Nedlastingen virket ikke her. Trykk «Kopier svarene» og lim teksten inn i Word i stedet.",false)}return}
  try{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.style.display="none";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);status("Filen er lastet ned. Se etter den i nedlastingsmappen.",true)}
  catch(e){status("Nedlastingen virket ikke her. Trykk «Kopier svarene» og lim teksten inn i Word i stedet.",false)}
}
async function copy(text,status){
  try{await navigator.clipboard.writeText(text);status("Svarene er kopiert. Lim dem inn i et Word-dokument.",true)}
  catch(e){status("Kopieringen virket ikke. Merk teksten i boksene og kopier den selv.",false)}
}
